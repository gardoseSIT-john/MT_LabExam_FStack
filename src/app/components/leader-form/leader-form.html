
<h2>{{ isEditMode ? 'Edit Gym Leader' : 'Register Gym Leader' }}</h2>

@if (errorMessage) {
  <p class="error">{{ errorMessage }}</p>
}

<form [formGroup]="leaderForm" (ngSubmit)="onSubmit()">
  <label for="name">Name</label>
  <input id="name" formControlName="name" />

  <label for="region">Region</label>
  <select id="region" formControlName="region">
    <option value="Kanto">Kanto</option>
    <option value="Johto">Johto</option>
    <option value="Hoenn">Hoenn</option>
  </select>

  <label for="town">Town</label>
  <input id="town" formControlName="town" />

  <label for="badge">Badge</label>
  <input id="badge" formControlName="badge" />

  <label for="specialty">Specialty</label>
  <input id="specialty" formControlName="specialty" />

  <label for="aceLevel">Ace Level</label>
  <input
    id="aceLevel"
    type="number"
    formControlName="aceLevel"
    min="1"
    max="100"
  />

  <label for="motto">Motto (optional)</label>
  <textarea
    id="motto"
    formControlName="motto"
    maxlength="150"
  ></textarea>

  <button type="submit">
    {{ isEditMode ? 'Save Changes' : 'Add Leader' }}
  </button>

  <a routerLink="/leaders">Cancel</a>
</form>
